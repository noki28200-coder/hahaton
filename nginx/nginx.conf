worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Апстримы ──────────────────────────────────────────────
    upstream api_backend {
        server api:8000;
    }

    # ──────────────────────────────────────────────────────────
    server {
        listen 80;

        # ── Здоровье системы (без авторизации) ────────────────
        location = /health {
            proxy_pass         http://api_backend;
            proxy_set_header   Host $host;
        }

        # ── OpenAPI документация (FastAPI auto-docs) ──────────
        location /docs {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # ── REST API звонков (CRM интеграция) ─────────────────
        location /calls {
            proxy_pass         http://api_backend;
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Для стриминга аудио — отключаем буферизацию
            proxy_buffering        off;
            proxy_read_timeout     300s;
            proxy_send_timeout     300s;

            # Для ручной загрузки файлов
            client_max_body_size   200M;
            client_body_timeout    120s;
        }

        # ── Административный API ──────────────────────────────
        location /admin {
            proxy_pass         http://api_backend;
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ════════════════════════════════════════════════════════
        # МЕСТО ДЛЯ ФРОНТЕНДА
        # ════════════════════════════════════════════════════════
        # Команда фронтенда: замените этот блок на свой сервис.
        #
        # Вариант 1 — проксировать на фронтенд-сервис (React/Vue/Next.js):
        #   upstream frontend_backend {
        #       server frontend:3000;
        #   }
        #   location / {
        #       proxy_pass       http://frontend_backend;
        #       proxy_set_header Host $host;
        #       ...
        #   }
        #
        # Вариант 2 — раздавать статические файлы (build папка):
        #   location / {
        #       root  /usr/share/nginx/html;
        #       index index.html;
        #       try_files $uri $uri/ /index.html;
        #   }
        #   + добавить volume в docker-compose: ./frontend/dist:/usr/share/nginx/html:ro
        #
        # Фронтенд — статические файлы
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
