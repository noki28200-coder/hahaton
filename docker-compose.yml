services:

  # ════════════════════════════════════════════════════════════
  # ИНФРАСТРУКТУРА
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-callsdb}
      POSTGRES_USER:     ${POSTGRES_USER:-callsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callsuser} -d ${POSTGRES_DB:-callsdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Не выставляем порт наружу — доступ только внутри сети

  minio:
    image: quay.io/minio/minio:RELEASE.2024-07-04T14-25-45Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"   # Веб-консоль MinIO
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-call-audios}
    entrypoint: >
      /bin/sh -c "
        mc alias set local $$MINIO_ENDPOINT $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        mc anonymous set none local/$$MINIO_BUCKET &&
        echo '[minio-init] Bucket $$MINIO_BUCKET готов'
      "
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092
      KAFKA_LISTENERS:                        PLAINTEXT://0.0.0.0:9092
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:               zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       "false"
      KAFKA_LOG_RETENTION_HOURS:             168
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./init-scripts/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # СЕРВИСЫ ПРИЛОЖЕНИЯ
  # ════════════════════════════════════════════════════════════

  # ── Главный API: REST для CRM + ручная загрузка ─────────────
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-call-audios}
      API_KEY:          ${API_KEY:-dev-insecure-key}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Сборщик записей из МангоОфис (Go) ──────────────────────
  mango-collector:
    build: ./mango-collector-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN:             postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:          kafka:9092
      MINIO_ENDPOINT:           http://minio:9000
      MINIO_ACCESS_KEY:         ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY:         ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:             ${MINIO_BUCKET:-call-audios}
      MANGO_API_KEY:            ${MANGO_API_KEY}
      MANGO_API_SALT:           ${MANGO_API_SALT}
      MANGO_API_URL:            ${MANGO_API_URL:-https://app.mango-office.ru/vpbx}
      POLL_INTERVAL_SECONDS:    ${POLL_INTERVAL_SECONDS:-300}
      LOOKBACK_MINUTES:         ${LOOKBACK_MINUTES:-10}

  # ── WhisperX ML-сервис (Python, только инференс) ────────────
  whisperx-service:
    build: ./whisperx-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL:    ${WHISPER_MODEL:-medium}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      WHISPER_THREADS:  ${WHISPER_THREADS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Транскрибация звонков (Go) ───────────────────────────────
  transcriber:
    build: ./transcriber-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      whisperx-service:
        condition: service_healthy
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-call-audios}
      WHISPERX_URL:     http://whisperx-service:8001
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}

  # ── Анализ транскрипций (Go + Ollama / Gemma) ────────────────
  analyzer:
    build: ./analyzer-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    environment:
      POSTGRES_DSN:     postgresql://${POSTGRES_USER:-callsuser}:${POSTGRES_PASSWORD:-callspassword}@postgres:5432/${POSTGRES_DB:-callsdb}
      KAFKA_BOOTSTRAP:  kafka:9092
      OLLAMA_HOST:      http://ollama:11434
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-gemma3:4b}
      CRM_WEBHOOK_URL:  ${CRM_WEBHOOK_URL:-}

  # ── Nginx: точка входа ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  ollama_models:
